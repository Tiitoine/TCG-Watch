name: TCG Watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tcg-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Détecter les nouvelles pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PWA_URL: ${{ vars.PWA_URL }}
        run: python detector.py

      - name: Enregistrer l'état et les données
        run: |
          git config user.name "tcg-watch"
          git config user.email "tcg-watch@users.noreply.github.com"
          git add state docs/data.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "maj $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
