<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1322">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TCG Watch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TCG Watch</title>
<style>
  :root{
    --bg:#0e1322; --surface:#161d33; --surface-2:#1e2845; --line:#2b3658;
    --text:#eef1fb; --muted:#9aa4c6; --accent:#9db4ff; --on-game:#10131f;
    --pokemon:#ffcb05; --onepiece:#ff5d4d; --cyberpunk:#27e0d0;
    --pokemon-ink:#ffcb05; --onepiece-ink:#ff8274; --cyberpunk-ink:#27e0d0;
    --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f4fb; --surface:#ffffff; --surface-2:#e8ecf8; --line:#d5dbee;
      --text:#141a30; --muted:#586184; --accent:#3552d6; --on-game:#10131f;
      --pokemon-ink:#8a6a00; --onepiece-ink:#c0312a; --cyberpunk-ink:#0a7f76;
    }
  }
  .g-pokemon{--g:var(--pokemon);--gi:var(--pokemon-ink)}
  .g-onepiece{--g:var(--onepiece);--gi:var(--onepiece-ink)}
  .g-cyberpunk{--g:var(--cyberpunk);--gi:var(--cyberpunk-ink)}
  .g-other{--g:var(--muted);--gi:var(--muted)}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 "Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    padding:0 16px calc(32px + env(safe-area-inset-bottom));max-width:680px;margin-inline:auto}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- en-tête collant ---------- */
  .top{position:sticky;top:0;z-index:10;margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
    background:color-mix(in srgb,var(--bg) 97%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
  #updated{margin:1px 0 0;font-size:.78rem;color:var(--muted)}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
    display:grid;place-items:center;flex:none}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
  .icon-btn:active,.tab:active,.chip:active{transform:scale(.96)}

  .tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;
    font-weight:650;font-size:.92rem;display:flex;align-items:center;gap:8px}
  .tab .n{font-weight:500;font-size:.8rem;opacity:.7;font-variant-numeric:tabular-nums}
  .tab[aria-pressed="true"]{background:var(--g,var(--text));color:var(--on-game,var(--bg));border-color:transparent}
  .tab.all[aria-pressed="true"]{background:var(--text);color:var(--bg)}

  /* ---------- outils ---------- */
  .tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0 8px}
  .tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
  .tools select{max-width:40vw;text-overflow:ellipsis}
  .chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 4px;padding:0 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:.84rem;color:var(--muted)}
  .chip[aria-pressed="true"]{color:var(--text);border-color:var(--accent);background:var(--surface-2)}

  /* ---------- sections ---------- */
  .sec-title{display:flex;align-items:baseline;gap:8px;margin:22px 0 4px;font-size:1.12rem;font-weight:800;letter-spacing:-.01em}
  .sec-title .n{font-size:.85rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .day{margin:16px 2px 8px;font-size:.88rem;font-weight:650;color:var(--muted);text-transform:capitalize}
  ul{list-style:none;margin:0;padding:0}

  /* ---------- carte nouveauté ---------- */
  .item{position:relative;background:var(--surface);border-radius:var(--radius);overflow:hidden;margin:0 0 10px}
  .item::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--g)}
  .item a.link{display:block;padding:13px 54px 13px 19px;color:inherit;text-decoration:none}
  .item a.link:focus-visible{outline-offset:-3px}
  .item.fresh{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g) 55%,transparent)}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kind{font-size:1.05rem;font-weight:780;letter-spacing:-.015em}
  .tag{font-size:.74rem;font-weight:650;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--text)}
  .tag.new{background:var(--g);color:var(--on-game)}
  .name{margin:3px 0 9px;font-size:.92rem;line-height:1.35;opacity:.9;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px;font-size:.8rem;color:var(--muted)}
  .meta .shop{color:var(--text);font-weight:650}
  .meta .game{color:var(--gi);font-weight:650}
  .meta .when{margin-left:auto;font-variant-numeric:tabular-nums}
  .fav{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:none;border-radius:50%;
    display:grid;place-items:center;color:var(--muted)}
  .fav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
  .fav[aria-pressed="true"]{color:var(--pokemon)}
  .fav[aria-pressed="true"] svg{fill:currentColor}
  @media (prefers-color-scheme: light){ .fav[aria-pressed="true"]{color:#c58a00} }

  /* ---------- liste compacte (déjà en ligne) ---------- */
  details.archive{margin-top:26px;border-top:1px solid var(--line)}
  details.archive>summary{list-style:none;cursor:pointer;padding:16px 2px;font-size:1.02rem;font-weight:750;display:flex;align-items:center;gap:8px}
  details.archive>summary::-webkit-details-marker{display:none}
  details.archive>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
  details.archive[open]>summary::after{transform:rotate(-135deg)}
  details.archive>summary .n{font-weight:500;font-size:.85rem;color:var(--muted)}
  .site-h{display:flex;align-items:baseline;gap:8px;margin:18px 2px 6px;font-weight:700;font-size:.95rem}
  .site-h .n{font-weight:500;font-size:.8rem;color:var(--muted)}
  .row{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;margin-bottom:6px;overflow:hidden}
  .row::before{content:"";align-self:stretch;width:4px;background:var(--g);flex:none}
  .row a{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;padding:10px 0;color:inherit;text-decoration:none}
  .row .k{flex:none;font-weight:720;font-size:.84rem;min-width:4.6em}
  .row .t{min-width:0;font-size:.86rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .fav{position:static;width:40px;height:40px;flex:none}
  .row .fav svg{width:18px;height:18px}
  .more{width:100%;margin:2px 0 8px;padding:10px;border:1px dashed var(--line);background:none;border-radius:10px;color:var(--muted);font-size:.88rem}

  /* ---------- états ---------- */
  .empty{margin:12px 0;padding:22px 18px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:.92rem}
  .empty strong{display:block;color:var(--text);font-size:1rem;margin-bottom:4px}
  details.health{margin-top:28px;color:var(--muted);font-size:.85rem}
  details.health summary{cursor:pointer;padding:6px 2px}
  .site-state{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line)}
  .ok{color:var(--cyberpunk-ink)} .ko{color:var(--onepiece-ink)}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div>
      <h1>TCG Watch</h1>
      <p id="updated">Chargement…</p>
    </div>
    <button id="refresh" class="icon-btn" type="button" aria-label="Actualiser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Jeu"></nav>
</div>

<div class="tools">
  <input id="q" type="search" placeholder="Rechercher" autocomplete="off" aria-label="Rechercher un produit">
  <select id="site" aria-label="Enseigne"><option value="">Enseignes</option></select>
</div>
<div class="chips" id="kinds" role="group" aria-label="Type de produit"></div>

<main id="main"></main>

<details class="health">
  <summary>État des enseignes surveillées</summary>
  <div id="sites"></div>
</details>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

const KINDS = [
  ["display", "Display"], ["etb", "ETB"], ["ultra", "Ultra-Premium"], ["coffret", "Coffret"],
  ["deck", "Deck"], ["booster", "Booster"], ["autre", "Autre page"]
];
const KIND_LABEL = Object.fromEntries(KINDS);
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z" stroke-linejoin="round"/></svg>';

let data = { items: [], sites: {}, games: {} };
let favs = new Set(store.get("favs", []));
const lastVisit = store.get("lastVisit", 0);
const saved = store.get("filters", {});
const filter = { game: saved.game || "", kind: saved.kind || "", site: "", q: "", favOnly: false };
const expanded = new Set();
let archiveOpen = false;

/* ---------- aides ---------- */
function plain(it){
  let u = it.url; try{ u = decodeURIComponent(it.url); }catch(e){}
  return (u + " " + it.title).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[-_+/.?=&]+/g, " ");
}
function kindOf(it){
  if (it._k) return it._k;
  const t = plain(it);
  let k = "autre";
  if (/display|boite de \d+|\b(12|18|24|30|36) boosters?\b/.test(t)) k = "display";
  else if (/ultra premium|\bupc\b/.test(t)) k = "ultra";
  else if (/\betb\b|elite trainer|dresseur d elite/.test(t)) k = "etb";
  else if (/coffret|collection|bundle|tripack|\btin\b|pokebox|\bbox\b/.test(t)) k = "coffret";
  else if (/\bdeck|starter|demarrage/.test(t)) k = "deck";
  else if (/booster|blister|\bpack\b/.test(t)) k = "booster";
  it._k = k; it._pre = /precommande|pre ?order|reserv/.test(t);
  return k;
}
const isFresh = (it) => !it.baseline && new Date(it.first_seen).getTime() > lastVisit;
const gameClass = (it) => "g-" + (["pokemon", "onepiece", "cyberpunk"].includes(it.game) ? it.game : "other");
const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
const gameName = (id) => (data.games && data.games[id]) || id;

function ago(iso){
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "à l'instant";
  if (s < 3600) return "il y a " + Math.round(s / 60) + " min";
  if (s < 86400) return "il y a " + Math.round(s / 3600) + " h";
  return "il y a " + Math.round(s / 86400) + " j";
}
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function dayLabel(d){
  const now = new Date(), y = new Date(now); y.setDate(y.getDate() - 1);
  if (sameDay(d, now)) return "Aujourd'hui";
  if (sameDay(d, y)) return "Hier";
  return new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(d);
}
function clock(iso){
  const d = new Date(iso);
  return sameDay(d, new Date()) ? ago(iso) : new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" }).format(d);
}

function matches(it, skip){
  if (skip !== "game" && filter.game && it.game !== filter.game) return false;
  if (filter.kind && kindOf(it) !== filter.kind) return false;
  if (filter.site && it.site !== filter.site) return false;
  if (filter.favOnly && !favs.has(it.url)) return false;
  const q = filter.q.trim().toLowerCase();
  if (q && !(plain(it) + " " + it.site_name.toLowerCase()).includes(q)) return false;
  return true;
}

function favButton(it, rerender){
  const b = el("button", "fav"); b.type = "button"; b.innerHTML = STAR;
  b.setAttribute("aria-pressed", String(favs.has(it.url)));
  b.setAttribute("aria-label", "Mettre en favori");
  b.onclick = () => {
    favs.has(it.url) ? favs.delete(it.url) : favs.add(it.url);
    store.set("favs", [...favs]); rerender();
  };
  return b;
}

/* ---------- barres ---------- */
function buildTabs(){
  const box = $("tabs"); box.textContent = "";
  const counts = {};
  for (const it of data.items || []) if (matches(it, "game")) counts[it.game] = (counts[it.game] || 0) + 1;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const defs = [["", "Tous", total], ...Object.entries(data.games || {}).map(([id, n]) => [id, n, counts[id] || 0])];
  for (const [id, label, n] of defs){
    const b = el("button", "tab " + (id ? "g-" + id : "all")); b.type = "button";
    b.append(el("span", null, label), el("span", "n", String(n)));
    b.setAttribute("aria-pressed", String(filter.game === id));
    b.onclick = () => { filter.game = id; persist(); refresh(); };
    box.appendChild(b);
  }
}
function buildKinds(){
  const box = $("kinds"); box.textContent = "";
  const mk = (id, label, pressed, fn) => {
    const b = el("button", "chip", label); b.type = "button";
    b.setAttribute("aria-pressed", String(pressed)); b.onclick = fn; box.appendChild(b);
  };
  mk("", "Tous types", !filter.kind, () => { filter.kind = ""; persist(); refresh(); });
  for (const [id, label] of KINDS) mk(id, label, filter.kind === id, () => { filter.kind = filter.kind === id ? "" : id; persist(); refresh(); });
  const f = el("button", "chip", "Favoris"); f.type = "button";
  f.setAttribute("aria-pressed", String(filter.favOnly));
  f.onclick = () => { filter.favOnly = !filter.favOnly; refresh(); };
  box.appendChild(f);
}
const persist = () => store.set("filters", { game: filter.game, kind: filter.kind });

function buildSites(){
  const sel = $("site"); const keep = filter.site; sel.length = 1;
  for (const [id, s] of Object.entries(data.sites || {})){
    const o = el("option", null, s.name); o.value = id; sel.appendChild(o);
  }
  sel.value = keep;
  const box = $("sites"); box.textContent = "";
  for (const s of Object.values(data.sites || {})){
    const row = el("div", "site-state");
    const state = el("span", s.ok ? "ok" : "ko", s.ok ? `lue, ${s.urls_seen.toLocaleString("fr-FR")} pages vues` : "illisible");
    row.append(el("span", null, s.name), state); box.appendChild(row);
  }
}

/* ---------- cartes ---------- */
function freshCard(it){
  const li = el("li", "item " + gameClass(it) + (isFresh(it) ? " fresh" : ""));
  const a = el("a", "link"); a.href = safeUrl(it.url); a.target = "_blank"; a.rel = "noopener noreferrer";
  const head = el("div", "head");
  head.appendChild(el("span", "kind", KIND_LABEL[kindOf(it)]));
  if (it._pre) head.appendChild(el("span", "tag", "Précommande"));
  if (isFresh(it)) head.appendChild(el("span", "tag new", "Nouveau"));
  const meta = el("div", "meta");
  meta.append(el("span", "shop", it.site_name), el("span", "game", gameName(it.game)), el("span", "when", clock(it.first_seen)));
  a.append(head, el("div", "name", it.title), meta);
  li.append(a, favButton(it, render));
  return li;
}
function compactRow(it){
  const li = el("li", "row " + gameClass(it));
  const a = el("a"); a.href = safeUrl(it.url); a.target = "_blank"; a.rel = "noopener noreferrer";
  a.append(el("span", "k", KIND_LABEL[kindOf(it)]), el("span", "t", it.title));
  li.append(a, favButton(it, render));
  return li;
}

function render(){
  const main = $("main"); main.textContent = "";
  const all = (data.items || []).filter((it) => matches(it));
  const fresh = all.filter((it) => !it.baseline).sort((a, b) => b.first_seen.localeCompare(a.first_seen));
  const old = all.filter((it) => it.baseline);

  const h = el("h2", "sec-title", "Nouveautés"); h.append(el("span", "n", String(fresh.length))); main.appendChild(h);
  if (fresh.length){
    let lastDay = "", ul = null;
    for (const it of fresh.slice(0, 200)){
      const d = new Date(it.first_seen), key = d.toDateString();
      if (key !== lastDay){ main.appendChild(el("div", "day", dayLabel(d))); ul = el("ul"); main.appendChild(ul); lastDay = key; }
      ul.appendChild(freshCard(it));
    }
  } else {
    const e = el("div", "empty");
    const filtered = filter.game || filter.kind || filter.site || filter.q || filter.favOnly;
    e.append(el("strong", null, filtered ? "Rien ne correspond à ces filtres" : "Aucune nouvelle page pour l'instant"),
      document.createTextNode(filtered ? "Retire un filtre pour voir plus de pages."
        : (data.updated ? "Dernière vérification " + ago(data.updated) + ". Le détecteur repasse toutes les 15 minutes." : "")));
    main.appendChild(e);
  }

  if (old.length){
    const d = el("details", "archive"); d.open = archiveOpen || filter.q.trim().length > 0;
    d.ontoggle = () => { if (!filter.q.trim()) archiveOpen = d.open; };
    const s = el("summary", null, "Déjà en ligne"); s.append(el("span", "n", String(old.length))); d.appendChild(s);
    const bySite = new Map();
    for (const it of old){ if (!bySite.has(it.site_name)) bySite.set(it.site_name, []); bySite.get(it.site_name).push(it); }
    for (const [name, list] of [...bySite].sort((a, b) => b[1].length - a[1].length)){
      const rank = (it) => KINDS.findIndex(([id]) => id === kindOf(it));
      list.sort((a, b) => rank(a) - rank(b) || a.title.localeCompare(b.title));
      const sh = el("div", "site-h", name); sh.append(el("span", "n", String(list.length))); d.appendChild(sh);
      const ul = el("ul"); const open = expanded.has(name); const shown = open ? list : list.slice(0, 20);
      for (const it of shown) ul.appendChild(compactRow(it));
      d.appendChild(ul);
      if (!open && list.length > 20){
        const m = el("button", "more", `Afficher les ${list.length - 20} autres`); m.type = "button";
        m.onclick = () => { expanded.add(name); archiveOpen = true; render(); };
        d.appendChild(m);
      }
    }
    main.appendChild(d);
  }
}

function refresh(){ buildTabs(); buildKinds(); render(); }

async function load(){
  $("updated").textContent = "Chargement…";
  try{
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    $("updated").textContent = "Vérifié " + ago(data.updated);
  }catch(e){
    $("updated").textContent = "Données indisponibles, réessaie";
  }
  buildSites(); refresh();
}

$("refresh").onclick = load;
$("q").oninput = (e) => { filter.q = e.target.value; refresh(); };
$("site").onchange = (e) => { filter.site = e.target.value; refresh(); };
const mark = () => store.set("lastVisit", Date.now());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") mark(); });
window.addEventListener("pagehide", mark);
if ("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
load();
</script>
</body>
</html>
